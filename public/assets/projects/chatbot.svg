<text x='344' y='220' fill='#fafafa' font-size='13' font-family='Inter,Segoe UI,Arial,sans-serif'>A StateGraph is a graph whose nodes read and</text>
<text x='344' y='240' fill='#fafafa' font-size='13' font-family='Inter,Segoe UI,Arial,sans-serif'>update a shared state. Here, ChatState holds the</text>
<text x='344' y='260' fill='#fafafa' font-size='13' font-family='Inter,Segoe UI,Arial,sans-serif'>message list and a checkpointer persists it</text>
<text x='344' y='280' fill='#fafafa' font-size='13' font-family='Inter,Segoe UI,Arial,sans-serif'>per thread_id so chats survive restarts.▍</text>
